[project]
name = "streamlit-canvas-graph"
version = "0.1.0"
description = "A GitHub-backed dependency and vulnerability graph explorer for Streamlit."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "chtaylo3" }]
maintainers = [{ name = "chtaylo3" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "dynaconf>=3.3.5",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "packaging>=26.3",
    "pillow>=12.3.0",
    "plotly>=7.0.0",
    "pytz>=2026.3.post1",
    "rich>=15.0.0",
    "streamlit>=1.62.0",
    "streamlit-graph-canvas==0.1.0rc2",
    "streamlit-graph-canvas-contrib==0.1.0rc2",
    "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/chtaylo3/streamlit-canvas-graph-example"
Repository = "https://github.com/chtaylo3/streamlit-canvas-graph-example"
Issues = "https://github.com/chtaylo3/streamlit-canvas-graph-example/issues"

[project.scripts]
streamlit-canvas-graph = "streamlit_canvas_graph:main"
scg = "streamlit_canvas_graph.cli:app"
scg-ingest = "streamlit_canvas_graph.cli:ingest_app"
scg-provision = "streamlit_canvas_graph.cli:provision_app"

[build-system]
requires = ["uv_build>=0.8.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
